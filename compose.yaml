services:
  node-sync:
    build: .
    container_name: shredder-grafana-connect
    restart: unless-stopped
    # Root is required only to read the host's root-owned 0600 SSH key.
    # All Linux capabilities are still dropped below.
    user: "0:0"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ${SSH_KEY_HOST_PATH:-/root/.ssh/id_ed25519}:/run/secrets/id_ed25519:ro
      - ${PROMETHEUS_TARGETS_HOST_DIR:-./prometheus/targets}:/prometheus-targets
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
